<!DOCTYPE html>

<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contatti – MLC</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f6f1ea;
color:#2f2f2f;
line-height:1.6;
}

/* HEADER */

header{
background:white;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,0.06);
position:sticky;
top:0;
z-index:10;
}

.logo{
height:55px;
}

nav a{
margin-left:25px;
text-decoration:none;
color:#555;
font-weight:500;
}

nav a:hover{
color:#b89663;
}

/* SECTION */

.section{
max-width:900px;
margin:100px auto;
padding:0 30px;
text-align:center;
}

.section h1{
font-family:'Playfair Display',serif;
color:#b89663;
font-size:40px;
margin-bottom:20px;
}

.section p{
font-size:18px;
margin-bottom:30px;
}

/* CONTACT BOX */

.contact-box{
background:white;
padding:35px;
border-radius:14px;
box-shadow:0 10px 28px rgba(0,0,0,0.08);
max-width:420px;
margin:40px auto;
}

/* FORM */

.contact-form{
max-width:600px;
margin:40px auto 0;
display:flex;
flex-direction:column;
gap:15px;
}

.contact-form input,
.contact-form textarea{
padding:14px;
border-radius:8px;
border:1px solid #ddd;
font-family:'Inter',sans-serif;
font-size:15px;
}

.contact-form textarea{
min-height:120px;
resize:vertical;
}

.contact-form button{
background:#b89663;
color:white;
border:none;
padding:14px;
border-radius:40px;
font-weight:600;
cursor:pointer;
}

.contact-form button:hover{
background:#9f7d4f;
}

/* FOOTER */

footer{
background:#2f2f2f;
color:white;
text-align:center;
padding:30px;
margin-top:80px;
}

</style>

</head>

<body>

<header>

<img src="img/logo.png" class="logo">

<nav>
<a href="index.html">Home</a>
<a href="chi-siamo.html">Chi siamo</a>
<a href="servizi.html">Servizi</a>
<a href="contatti.html">Contatti</a>
</nav>

</header>

<section class="section">

<h1>Contatti</h1>

<p>
Per informazioni sui servizi o per organizzare il tuo matrimonio,
contattaci direttamente.
</p>

<div class="contact-box">

<p><strong>Email</strong><br>info@mlc-matrimoni.it</p>

<p><strong>Telefono</strong><br>+39 XXX XXX XXXX</p>

</div>

<form action="https://formsubmit.co/info@mlc-matrimoni.it" method="POST" class="contact-form">

<input type="text" name="name" placeholder="Nome e cognome" required>

<input type="email" name="email" placeholder="Email" required>

<input type="tel" name="phone" placeholder="Telefono">

<textarea name="message" placeholder="Scrivi il tuo messaggio..." required></textarea>

<button type="submit">Invia messaggio</button>

</form>

</section>

<footer>

<p>© 2026 MLC – Matrimoni Low Cost</p>

</footer>

</body>
</html>
