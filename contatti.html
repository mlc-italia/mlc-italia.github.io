<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti – MLC</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: #333;
    background-color: #faf7f4;
    line-height: 1.6;
  }

  header {
    background: #fff;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 2px;
  }

  nav a {
    margin-left: 25px;
    text-decoration: none;
    color: #555;
    font-weight: 500;
  }

  nav a:hover { color: #c39a6b; }

  .content {
    max-width: 600px;
    margin: 40px auto;
    padding: 50px 40px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    text-align: center;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 25px;
    color: #c39a6b;
  }

  p { margin-bottom: 15px; font-size: 1em; color: #555; }

  a.button {
    display: inline-block;
    padding: 14px 28px;
    background: #c39a6b;
    color: white;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 20px;
  }

  a.button:hover { background: #a67c55; }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
  }

  input, textarea {
    padding: 12px;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-family: inherit;
    font-size: 1em;
    width: 100%;
  }

  textarea { min-height: 100px; resize: vertical; }

  input[type="submit"] {
    background: #c39a6b;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  input[type="submit"]:hover {
    background: #a67c55;
    transform: translateY(-2px);
  }

  @media (max-width: 768px) {
    .content { padding: 40px 20px; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 28px; }
  }
</style>
</head>

<body>

<header>
  <h1>MLC</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="chi-siamo.html">Chi siamo</a>
    <a href="servizi.html">Servizi</a>
    <a href="contatti.html">Contatti</a>
  </nav>
</header>

<div class="content">
  <h1>Contatti</h1>

  <p><strong>Email:</strong> <a href="mailto:matrimoniodrive@gmail.com" style="color:#c39a6b; text-decoration:underline;">matrimoniodrive@gmail.com</a></p>
  <p><strong>Telefono:</strong> <a href="tel:+393286627293" style="color:#c39a6b; text-decoration:underline;">+39 328 662 7293</a></p>

  <p>Oppure utilizza il modulo qui sotto:</p>

    <input type="email" name="email" placeholder="La tua email" required>
    <textarea name="messaggio" placeholder="Scrivi il tuo messaggio..." required></textarea>
    <input type="submit" value="Invia">
  </form>
</div>

</body>
</html>
