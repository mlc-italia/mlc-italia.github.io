<body class="contatti">

<header>
  <a href="index.html">
  <img src="img/logo.png" class="logo" alt="MLC Logo">
</a>
  
  <div class="hamburger" id="hamburger">
    <div></div>

  </nav>
</header>

<section class="section">
  <h2>Contattaci</h2>

  <form action="https://formsubmit.co/mlc.matrimoni@gmail.com" method="POST" class="contact-form" id="contactForm">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="name" placeholder="Nome e cognome" required>
    <input type="tel" name="phone" placeholder="Telefono (+39 123 456 7890)" pattern="\+39\s?[0-9]{3}\s?[0-9]{3}\s?[0-9]{4}" title="Formato: +39 123 456 7890">
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Scrivi il tuo messaggio..." required></textarea>
    <button type="submit">Invia messaggio</button>
  </form>

  <div id="successMessage">
    Il tuo messaggio è stato inviato correttamente! Grazie.
  </div>
</section>

<footer>
<p>© 2026 MLC – Matrimoni Low Cost</p>
</footer>

<script src="js/forms.js" defer></script>
